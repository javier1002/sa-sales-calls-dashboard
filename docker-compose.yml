services:
  postgres-db:
    image: postgres:15-alpine
    container_name: codescrum-postgres
    environment:
      POSTGRES_USER: javier_admin
      POSTGRES_PASSWORD: 1003
      POSTGRES_DB: codescrum_marketing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

volumes:
  postgres_data: